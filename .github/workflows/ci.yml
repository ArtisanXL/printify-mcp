name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run
      # Sync check: generated code must match the Spec Snapshot (and override file).
      # Deterministic output, so one leg is enough.
      - name: Check generated code is in sync
        if: matrix.node == 22
        run: |
          npm run generate
          if [ -n "$(git status --porcelain -- spec src/generated)" ]; then
            git status --short -- spec src/generated
            git diff -- spec src/generated | head -200
            echo "::error::Generated code is out of sync with the Spec Snapshot. Run 'npm run generate' and commit the result."
            exit 1
          fi
